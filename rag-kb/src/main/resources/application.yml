spring:
  application:
    name: rag-kb
  profiles:
    active: local
  ai:
    openai:
      # OpenAI 兼容接口均可：阿里云 DashScope / DeepSeek / OpenAI / 本地 Ollama(-v1)
      # 通过环境变量注入，切勿把 key 写进代码提交到 GitHub
      api-key: ${AI_API_KEY:sk-not-configured}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
          temperature: 0.1        # RAG 生成用低温度：可事实校验的场景不需要创造性
      embedding:
        options:
          model: ${AI_EMBED_MODEL:text-embedding-v3}
    # MCP Server（SSE over WebMVC）：把知识库+评测机封装成标准 MCP tools，
    # 客户端连接 http://localhost:8000/sse 即可发现并调用 RagKbTools 里的全部 @Tool
    mcp:
      server:
        enabled: true
        name: rag-kb-mcp-server
        version: 0.1.0
        protocol: SSE
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        instructions: >-
          rag-kb 企业知识库 MCP Server：用 kb_query 提问制度文档（带引用溯源），
          kb_retrieve 做纯检索归因（不消耗生成 token），
          eval_* 系列工具驱动评测机（跑批/进度/报告/错题本 diff），
          judge_error_record 仅供人工复核后记录裁判误判（人在回路）。
    # 切 Milvus 时（-Pmilvus 且 rag.vectorstore.simple=false）按需调整：
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
        databaseName: default
        collectionName: rag_kb

server:
  port: 8000

rag:
  vectorstore:
    simple: true                  # false + -Pmilvus → 切到 MilvusVectorStore
  chunk:
    strategy: recursive           # fixed | recursive | parent-child（单变量实验开关）
    size: 500
    overlap: 80
    parent-size: 1200
    child-size: 300
  retrieval:
    top-n: 20                     # 每路召回数
    final-k: 5                    # 喂给 LLM 的上下文块数
    hybrid: true                  # false → 纯向量（对照组）
    min-vector-similarity: 0.30   # 拒答阈值：漏答 vs 幻觉的权衡点，用评测集调
  rerank:
    enabled: false                # true → 启用 TEI/托管 rerank API
    base-url: ${RERANK_URL:http://localhost:8080/rerank}
  eval:
    dataset: data/eval/qa_v2/qa_v2.json   # 带 caseId/锚文本/heldOut 的 v2 测试集
    docs-dir: data/docs                   # 锚点校验时回读源文档用
    runs-dir: output/eval-runs            # JSONL：每 run 一个文件，逐条 append
    judge-errors-file: data/eval/judge-errors.md   # §4.2 人工复核沉淀的裁判失误清单
    judge:
      model: ${EVAL_JUDGE_MODEL:}         # 留空→复用 chat 模型（有 self-preference 风险，启动会 WARN）
      api-key: ${EVAL_JUDGE_API_KEY:${AI_API_KEY:sk-not-configured}}
      base-url: ${EVAL_JUDGE_BASE_URL:${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}}
