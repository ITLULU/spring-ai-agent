spring:
  application:
    name: rag-kb
  # 默认 profile 即零基建模式（内存向量库 + 内存 ChunkStore + 关闭 rerank），clone 即跑；
  # 持久化/生产形态显式激活：-Dspring-boot.run.profiles=persistent（见 application-persistent.yml）
  # spring-boot-starter-jdbc 在 classpath 后，默认会自动装配 DataSource 并在无 url 时启动失败；
  # 排除掉，改由 ChunkStoreDataSourceConfig 在 rag.chunk-store.type=postgres 时自建——
  # 保证默认内存模式“零基建 clone 即跑”不被破坏
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  ai:
    openai:
      # OpenAI 兼容接口均可：阿里云 DashScope / DeepSeek / OpenAI / 本地 Ollama(-v1)
      # 通过环境变量注入，切勿把 key 写进代码提交到 GitHub
      #
      # 两条腿分开指端点/指 key（百炼 Token Plan 个人版的现实约束）：
      #   · 生成腿 AI_CHAT_*  —— 包月 sk-sp- key 只能在 token-plan.cn-beijing.maas.aliyuncs.com 用；
      #   · 向量腿 AI_EMBED_* —— 包月清单里没有任何 embedding 模型，必须走按量的 dashscope。
      # 每层都是"专用 → 全局 → 占位"三级回落，不设任何 key 字面量；只想单换一条腿时只设那一条。
      api-key: ${AI_API_KEY:sk-not-configured}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        base-url: ${AI_CHAT_BASE_URL:${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}}
        api-key: ${AI_CHAT_API_KEY:${AI_API_KEY:sk-not-configured}}
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
          temperature: 0.1        # RAG 生成用低温度：可事实校验的场景不需要创造性
      embedding:
        base-url: ${AI_EMBED_BASE_URL:${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}}
        api-key: ${AI_EMBED_API_KEY:${AI_API_KEY:sk-not-configured}}
        options:
          model: ${AI_EMBED_MODEL:text-embedding-v3}
    # MCP Server（Streamable HTTP over WebMVC）：把知识库+评测机封装成标准 MCP tools，
    # 客户端连 http://localhost:8000/mcp 即可发现并调用 RagKbTools 里的全部 @Tool。
    # PRO-01：旧 SSE 传输(/sse + /mcp/message?sessionId)已被 MCP 规范废弃，2026-10 切 Streamable HTTP
    mcp:
      server:
        enabled: true
        name: rag-kb-mcp-server
        version: 0.1.0
        # 枚举 SSE | STREAMABLE | STATELESS（已从 starter 1.1.3 的 McpServerProperties$ServerProtocol 核实）
        protocol: STREAMABLE
        type: SYNC
        streamable-http:
          mcp-endpoint: /mcp        # starter 默认值，显式写出便于阅读；会话靠响应头 Mcp-Session-Id 维系
        instructions: >-
          rag-kb 企业知识库 MCP Server：用 kb_query 提问制度文档（带引用溯源），
          kb_retrieve 做纯检索归因（不消耗生成 token），
          eval_* 系列工具驱动评测机（跑批/进度/报告/错题本 diff），
          judge_error_record 仅供人工复核后记录裁判误判（人在回路）。
    # 切 Milvus 时（-Pmilvus 且 rag.vectorstore.simple=false）的配置：
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          # 本地 standalone 未开鉴权，默认 root/milvus 即可连；生产启用 TLS+鉴权时补 secure/证书配置
        databaseName: default
        collectionName: rag_kb            # 换 embedding 模型=换向量空间，必须换 collection 名或清库重灌
        embedding-dimension: 1024         # ⚠️ 必须显式对齐：starter 默认 1536(OpenAI)，text-embedding-v3 输出 1024；
                                          # 不对齐首次入库即 dimension mismatch 且 collection 建坏需 drop 重建
        initialize-schema: true           # 启动时自动建 collection+索引（生产已有 schema 时可关，交由 DBA 管理）
        metric-type: cosine               # 与内存库 SimpleVectorStore 同语义，min-vector-similarity=0.30 阈值可直接沿用
        index-type: IVF_FLAT              # 千级 chunk 够用；十万级+建议 HNSW（需重建 collection）

server:
  port: 8000

rag:
  vectorstore:
    simple: true                   # 默认内存 SimpleVectorStore（零基建）；false + -Pmilvus 构建 → 切到 MilvusVectorStore
  chunk-store:
    type: ${CHUNK_STORE_TYPE:memory}   # memory（默认，重启即空）| postgres（落库持久，重启后 warmup 自动重建 BM25）
  postgres:                       # 仅 type=postgres 时生效；生产用环境变量覆盖，勿写死密码
    url: ${PG_URL:jdbc:postgresql://localhost:5432/ragkb}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
  chunk:
    strategy: fixed           # fixed | recursive | parent-child（单变量实验开关）
    size: 500
    overlap: 80
    parent-size: 1200
    child-size: 300
  retrieval:
    top-n: 20                     # 每路召回数
    final-k: 5                    # 喂给 LLM 的上下文块数
    hybrid: true                  # false → 纯向量（对照组）
    min-vector-similarity: 0.30   # 拒答阈值：漏答 vs 幻觉的权衡点，用评测集调
  memory:
    max-messages: 20              # AGT-02 会话窗口（条数不是 token）：只存 question/answer，
                                  # 检索上下文走 system 模板不进窗口 → 20 条 ≈ 10 轮，成本上界可算
  rerank:
    enabled: ${RERANK_ENABLED:false}   # 默认关闭：未部署 TEI 时主链路不受牵连；true → 启用 TEI/托管 rerank API（persistent profile / 环境变量显式打开）
    base-url: ${RERANK_URL:http://localhost:8087/rerank}   # 本地 TEI GPU 版默认映射端口；CPU 版/托管 API 用 RERANK_URL 覆盖
  eval:
    dataset: data/eval/qa_v2/qa_v2.json   # 带 caseId/锚文本/heldOut 的 v2 测试集
    docs-dir: data/docs                   # 锚点校验时回读源文档用
    runs-dir: output/eval-runs            # JSONL：每 run 一个文件，逐条 append
    judge-errors-file: data/eval/judge-errors.md   # §4.2 人工复核沉淀的裁判失误清单
    judge:
      # 裁判也是一次 chat 调用，所以默认跟着生成腿走（同一个端点/同一把 key），
      # 避免出现"生成用包月 key、裁判拿同一把 key 去打 dashscope"这种必然 401 的组合。
      # 模型必须是指向端点提供的名字：包月清单里没有 qwen-max，用 qwen3.7-max（见 tokenplan profile）。
      model: ${EVAL_JUDGE_MODEL:qwen-max}
      api-key: ${EVAL_JUDGE_API_KEY:${AI_CHAT_API_KEY:${AI_API_KEY:sk-not-configured}}}
      base-url: ${EVAL_JUDGE_BASE_URL:${AI_CHAT_BASE_URL:${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}}}
