spring:
  application:
    name: rag-kb
  profiles:
    active: local
  # spring-boot-starter-jdbc 在 classpath 后，默认会自动装配 DataSource 并在无 url 时启动失败；
  # 排除掉，改由 ChunkStoreDataSourceConfig 在 rag.chunk-store.type=postgres 时自建——
  # 保证默认内存模式“零基建 clone 即跑”不被破坏
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  ai:
    openai:
      # OpenAI 兼容接口均可：阿里云 DashScope / DeepSeek / OpenAI / 本地 Ollama(-v1)
      # 通过环境变量注入，切勿把 key 写进代码提交到 GitHub
      api-key: ${AI_API_KEY:sk-not-configured}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
          temperature: 0.1        # RAG 生成用低温度：可事实校验的场景不需要创造性
      embedding:
        options:
          model: ${AI_EMBED_MODEL:text-embedding-v3}
    # MCP Server（SSE over WebMVC）：把知识库+评测机封装成标准 MCP tools，
    # 客户端连接 http://localhost:8000/sse 即可发现并调用 RagKbTools 里的全部 @Tool
    mcp:
      server:
        enabled: true
        name: rag-kb-mcp-server
        version: 0.1.0
        protocol: SSE
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        instructions: >-
          rag-kb 企业知识库 MCP Server：用 kb_query 提问制度文档（带引用溯源），
          kb_retrieve 做纯检索归因（不消耗生成 token），
          eval_* 系列工具驱动评测机（跑批/进度/报告/错题本 diff），
          judge_error_record 仅供人工复核后记录裁判误判（人在回路）。
    # 切 Milvus 时（-Pmilvus 且 rag.vectorstore.simple=false）的配置：
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          # 本地 standalone 未开鉴权，默认 root/milvus 即可连；生产启用 TLS+鉴权时补 secure/证书配置
        databaseName: default
        collectionName: rag_kb            # 换 embedding 模型=换向量空间，必须换 collection 名或清库重灌
        embedding-dimension: 1024         # ⚠️ 必须显式对齐：starter 默认 1536(OpenAI)，text-embedding-v3 输出 1024；
                                          # 不对齐首次入库即 dimension mismatch 且 collection 建坏需 drop 重建
        initialize-schema: true           # 启动时自动建 collection+索引（生产已有 schema 时可关，交由 DBA 管理）
        metric-type: cosine               # 与内存库 SimpleVectorStore 同语义，min-vector-similarity=0.30 阈值可直接沿用
        index-type: IVF_FLAT              # 千级 chunk 够用；十万级+建议 HNSW（需重建 collection）

server:
  port: 8000

rag:
  vectorstore:
    simple: true                  # false + -Pmilvus → 切到 MilvusVectorStore
  chunk-store:
    type: ${CHUNK_STORE_TYPE:memory}   # memory（默认，重启即空）| postgres（落库持久，重启后 warmup 自动重建 BM25）
  postgres:                       # 仅 type=postgres 时生效；生产用环境变量覆盖，勿写死密码
    url: ${PG_URL:jdbc:postgresql://localhost:5432/ragkb}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
  chunk:
    strategy: fixed           # fixed | recursive | parent-child（单变量实验开关）
    size: 500
    overlap: 80
    parent-size: 1200
    child-size: 300
  retrieval:
    top-n: 20                     # 每路召回数
    final-k: 5                    # 喂给 LLM 的上下文块数
    hybrid: true                  # false → 纯向量（对照组）
    min-vector-similarity: 0.30   # 拒答阈值：漏答 vs 幻觉的权衡点，用评测集调
  rerank:
    enabled: false                # true → 启用 TEI/托管 rerank API
    base-url: ${RERANK_URL:http://localhost:8080/rerank}
  eval:
    dataset: data/eval/qa_v2/qa_v2.json   # 带 caseId/锚文本/heldOut 的 v2 测试集
    docs-dir: data/docs                   # 锚点校验时回读源文档用
    runs-dir: output/eval-runs            # JSONL：每 run 一个文件，逐条 append
    judge-errors-file: data/eval/judge-errors.md   # §4.2 人工复核沉淀的裁判失误清单
    judge:
      model: ${EVAL_JUDGE_MODEL:}         # 留空→复用 chat 模型（有 self-preference 风险，启动会 WARN）
      api-key: ${EVAL_JUDGE_API_KEY:${AI_API_KEY:sk-not-configured}}
      base-url: ${EVAL_JUDGE_BASE_URL:${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}}
